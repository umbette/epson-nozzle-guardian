version: "3.8"

services:
  epson-guardian:
    build: .
    container_name: epson-guardian
    restart: unless-stopped
    ports:
      - "8086:8085"
    environment:
      - EPSON_HOST=${EPSON_HOST:-192.168.1.181}
      - EPSON_PORT=${EPSON_PORT:-631}
      - EPSON_USE_TLS=${EPSON_USE_TLS:-true}
      - INACTIVITY_DAYS=${INACTIVITY_DAYS:-5}
    volumes:
      - ./assets:/app/assets
      - ./config.yaml:/app/config.yaml:ro
    security_opt:
      - no-new-privileges:true
