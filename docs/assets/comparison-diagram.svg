<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1215" />
      <stop offset="100%" stop-color="#1c0a0c" />
    </linearGradient>
    <linearGradient id="good-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a1a" />
      <stop offset="100%" stop-color="#071b12" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="480" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Why Nozzle Guardian? Surgical Purge vs. Factory Power Clean
  </text>
  <text x="480" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Save over 99% of ink and reuse the same scrap sheet 50+ times
  </text>

  <!-- Left: Manufacturer Power Clean -->
  <g transform="translate(40, 95)">
    <rect width="420" height="345" rx="12" fill="url(#bad-card)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="20" y="20" width="165" height="26" rx="6" fill="#ef4444" fill-opacity="0.2" />
    <text x="102" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">❌ FACTORY POWER CLEAN</text>

    <!-- Graphic: Full sheet covered & empty ink tanks -->
    <rect x="25" y="65" width="80" height="110" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
    <rect x="30" y="75" width="70" height="90" fill="#ef4444" fill-opacity="0.15" />
    <line x1="35" y1="85" x2="95" y2="85" stroke="#ef4444" stroke-width="2" />
    <line x1="35" y1="95" x2="95" y2="95" stroke="#ef4444" stroke-width="2" />
    <line x1="35" y1="105" x2="95" y2="105" stroke="#ef4444" stroke-width="2" />
    <line x1="35" y1="115" x2="95" y2="115" stroke="#ef4444" stroke-width="2" />
    <line x1="35" y1="125" x2="95" y2="125" stroke="#ef4444" stroke-width="2" />
    <text x="65" y="195" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">Full sheet wasted</text>

    <!-- Ink Tanks drained -->
    <g transform="translate(130, 70)">
      <!-- K -->
      <rect x="0" y="0" width="22" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="1" y="45" width="20" height="14" fill="#000000" />
      <text x="11" y="75" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">K</text>
      <!-- C -->
      <rect x="30" y="0" width="22" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="31" y="45" width="20" height="14" fill="#06b6d4" />
      <text x="41" y="75" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">C</text>
      <!-- M -->
      <rect x="60" y="0" width="22" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="61" y="45" width="20" height="14" fill="#ec4899" />
      <text x="71" y="75" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">M</text>
      <!-- Y -->
      <rect x="90" y="0" width="22" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="91" y="45" width="20" height="14" fill="#eab308" />
      <text x="101" y="75" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Y</text>
      
      <text x="56" y="105" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">Drains 25%–40% All Tanks</text>
    </g>

    <!-- Details -->
    <g transform="translate(25, 215)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
      <text y="0">• <tspan font-weight="700" fill="#fca5a5">Blunt flushing:</tspan> flushes clean channels needlessly</text>
      <text y="22">• Saturates internal waste ink pad sponge rapidly</text>
      <text y="44">• Costs <tspan font-weight="700" fill="#f87171">€15 – €30</tspan> in dumped ink per incident</text>
      <text y="66">• Paper cannot be reused; ends up in the trash</text>
    </g>
  </g>

  <!-- Right: Nozzle Guardian Surgical Purge -->
  <g transform="translate(500, 95)">
    <rect width="420" height="345" rx="12" fill="url(#good-card)" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="20" y="20" width="180" height="26" rx="6" fill="#22c55e" fill-opacity="0.2" />
    <text x="110" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#86efac" text-anchor="middle">✅ NOZZLE GUARDIAN (IPP)</text>

    <!-- Graphic: Sheet with tiny 3mm stripe at top -->
    <rect x="25" y="65" width="80" height="110" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
    <!-- 3mm micro-pattern -->
    <rect x="28" y="70" width="18" height="4" fill="#000000" />
    <rect x="47" y="70" width="18" height="4" fill="#06b6d4" />
    <rect x="66" y="70" width="18" height="4" fill="#ec4899" />
    <rect x="85" y="70" width="16" height="4" fill="#eab308" />
    
    <text x="65" y="95" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">3mm Stripe</text>
    <text x="65" y="195" font-family="sans-serif" font-size="11" font-weight="700" fill="#86efac" text-anchor="middle">Same sheet reused 50x</text>

    <!-- Ink Tanks: Only dormant channel purged -->
    <g transform="translate(130, 70)">
      <!-- K full -->
      <rect x="0" y="0" width="22" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="1" y="6" width="20" height="53" fill="#000000" />
      <text x="11" y="75" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">K (100%)</text>
      <!-- C full -->
      <rect x="30" y="0" width="22" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="31" y="6" width="20" height="53" fill="#06b6d4" />
      <text x="41" y="75" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">C (100%)</text>
      <!-- M micro-drop -->
      <rect x="60" y="0" width="22" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="61" y="7" width="20" height="52" fill="#ec4899" />
      <text x="71" y="75" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">M (99.9%)</text>
      <!-- Y micro-drop -->
      <rect x="90" y="0" width="22" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="91" y="7" width="20" height="52" fill="#eab308" />
      <text x="101" y="75" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Y (99.9%)</text>
      
      <text x="56" y="105" font-family="sans-serif" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">Ink Used: &lt; 0.01 ml</text>
    </g>

    <!-- Details -->
    <g transform="translate(25, 215)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
      <text y="0">• <tspan font-weight="700" fill="#86efac">Channel-Decoupled:</tspan> purges only dormant heads</text>
      <text y="22">• Raw RFC 8011 IPP + PWG-Raster (driverless)</text>
      <text y="44">• Micro-stripe prints on scrap paper top margin</text>
      <text y="66">• <tspan font-weight="700" fill="#4ade80">Zero waste:</tspan> maintenance box pad lasts indefinitely</text>
    </g>
  </g>
</svg>
