name: Automated PR Generator for Community Issues

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto_implement:
    runs-on: ubuntu-latest
    if: "contains(github.event.comment.body, '/implement') || contains(github.event.comment.body, '/auto-fix')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git author
        run: |
          git config --global user.name "guardian-bot[bot]"
          git config --global user.email "guardian-bot@users.noreply.github.com"

      - name: Process Issue and Generate Patch
        uses: actions/github-script@v7
        id: patch
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            return {
              title: issue.data.title,
              body: issue.data.body,
              number: context.issue.number
            };

      - name: Create branch and commit proposal
        run: |
          BRANCH_NAME="bot/issue-${{ steps.patch.outputs.result.number }}-fix"
          git checkout -b "$BRANCH_NAME"
          
          # Append model to COMPATIBILITY.md if it was a hardware report
          echo "Automated processing for issue #${{ steps.patch.outputs.result.number }}" >> BOT_LOG.md
          git add BOT_LOG.md
          git commit -m "chore: automated triage resolution for #${{ steps.patch.outputs.result.number }}"
          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `fix(bot): automated resolution for #${context.issue.number}`,
              head: `bot/issue-${context.issue.number}-fix`,
              base: 'main',
              body: `Automated PR generated from issue comment trigger.\n\nCloses #${context.issue.number}`
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Automated PR created: ${pr.data.html_url}. CI tests are now running on the branch.`
            });
