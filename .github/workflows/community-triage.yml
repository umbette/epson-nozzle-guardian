name: Community Triage & Verification Bot

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    if: "!github.event.issue.pull_request"
    steps:
      - name: Community Issue Analyzer
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title.toLowerCase();
            
            // Detect Printer Compatibility Reports
            if (title.includes('compatibility') || title.includes('tested') || title.includes('model') || body.includes('### Printer Model')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['hardware-compatibility', 'community-report']
              });
              
              const comment = `👋 Hi @${issue.user.login}! Thank you for submitting a hardware compatibility test report for **Epson Nozzle Guardian**.
              
Our automated test tracker is reviewing your model details. Once validated against our IPP profile schema, it will be added to the official **COMPATIBILITY.md** matrix.

Feel free to mention any firmware or port quirks you observed!`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment
              });
            } else if (title.includes('bug') || body.includes('### Describe the bug')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['bug', 'needs-triage']
              });
            }
