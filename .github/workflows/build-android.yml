name: Build Android App (APK & AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run pure-JVM engine unit tests
        run: gradle testDebugUnitTest

      - name: Build sideload APK and Play Store App Bundle (AAB)
        run: gradle assembleDebug bundleRelease

      - name: Collect release outputs
        run: |
          mkdir -p out_android
          cp app/build/outputs/apk/debug/app-debug.apk out_android/NozzleGuardian-Android.apk
          cp app/build/outputs/bundle/release/app-release.aab out_android/NozzleGuardian-Android-PlayStore.aab

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NozzleGuardian-Android
          path: android/out_android/*

      - name: Attach Android binaries to latest GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
          if [ -n "$TAG" ]; then
            echo "Attaching Android APK & AAB to release $TAG..."
            gh release upload "$TAG" out_android/* --clobber -R "${{ github.repository }}"
          fi
